name: CF7 Form & Integration CI/CD Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  audit-cf7:
    name: Validate Contact Form 7 Forms & Integrations
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mcp-server/package-lock.json'

      - name: Install Dependencies
        working-directory: ./mcp-server
        run: npm ci

      - name: Compile TypeScript
        working-directory: ./mcp-server
        run: npm run build

      - name: Verify committed dist/ and bundle/ are up to date
        run: git diff --exit-code -- mcp-server/dist mcp-server/bundle

      - name: Validate Claude Code plugin and marketplace manifests
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
          claude plugin validate .claude-plugin/plugin.json --strict

      - name: Run MCP Server Unit Tests
        working-directory: ./mcp-server
        run: npm test

      - name: Run CF7 Forms Linter
        working-directory: ./mcp-server
        run: node dist/cli/lint.js
